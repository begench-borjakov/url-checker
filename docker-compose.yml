services:
  backend:
    build: ./backend
    container_name: url-checker-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: url-checker-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
